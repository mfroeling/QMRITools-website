---
layout: default
---
<div class="content">
  {{ content }}
</div>

<div class="widgets">
  {% for n in (1..3) %}
    {% assign key = 'widget' | append: n %}
    {% assign widget = page[key] %}
    {% if widget.title %}{% include _frontpage-widget.html widget=widget %}{% endif %}
  {% endfor %}
</div>

{% if page.callforaction %}
<p class="callforaction">
  <a class="button" href="{% unless page.callforaction.url contains 'http' %}{{ site.baseurl }}{% endunless %}{{ page.callforaction.url }}">{{ page.callforaction.text }}</a>
</p>
{% endif %}
